<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Horoscoop Engine UI</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f7;
      }
      header {
        background: #111827;
        color: white;
        padding: 12px 24px;
      }
      main {
        padding: 16px 24px 32px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border-radius: 8px;
        padding: 16px 20px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        font-size: 0.9rem;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 8px;
      }
      .tab {
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.9rem;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        border-bottom-color: #2563eb;
        color: #2563eb;
        font-weight: 600;
      }
      .tab-panel {
        display: none;
        font-size: 0.9rem;
      }
      .tab-panel.active {
        display: block;
      }
      .tab-panel--merged > * + * {
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
      }
      pre {
        background: #0f172a;
        color: #e5e7eb;
        padding: 8px;
        border-radius: 4px;
        overflow: auto;
        font-size: 0.8rem;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        font-size: 0.7rem;
        border-radius: 999px;
        background: #fee2e2;
        color: #b91c1c;
        margin-right: 4px;
      }
      button {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Horoscoop Engine</h1>
      <p style="margin: 0; font-size: 0.85rem">
        Research-grade time/astrology engine – web UI wrapper
      </p>
    </header>
    <main>
      <div class="card">
        <form id="horoscoop-form">
          <h2 style="margin-top: 0">Birth data</h2>
          <div class="row">
            <div>
              <label for="birth_date">Birth date (YYYY-MM-DD) *</label>
              <input
                type="date"
                id="birth_date"
                name="birth_date"
                required
              />
            </div>
            <div>
              <label for="birth_time_local">Birth time (HH:MM:SS) *</label>
              <input
                type="time"
                step="1"
                id="birth_time_local"
                name="birth_time_local"
                required
              />
            </div>
          </div>

          <div class="row" style="margin-top: 8px">
            <div>
              <label for="city">Place (city) *</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="Amsterdam"
                required
              />
            </div>
          </div>

          <!-- Hidden fields filled from city resolution (kept for API compatibility) -->
          <input type="hidden" id="lat" name="lat" />
          <input type="hidden" id="lon" name="lon" />
          <input type="hidden" id="timezone_iana" name="timezone_iana" />

          <div style="margin-top: 12px">
            <button type="submit">Compute horoscope</button>
          </div>
        </form>
      </div>

      <div id="results" class="card" style="display: none">
        <h2 style="margin-top: 0">Results</h2>
        <div id="diagnostics"></div>

        <div class="tabs" id="tabs">
          <div class="tab active" data-tab="story-energy">Story &amp; energy</div>
          <div class="tab" data-tab="western">Western</div>
          <div class="tab" data-tab="sidereal-vedic">Sidereal &amp; Vedic</div>
          <div class="tab" data-tab="chinese-bazi">Chinese &amp; BaZi</div>
        </div>

        <div id="panel-story-energy" class="tab-panel tab-panel--merged active"></div>
        <div id="panel-western" class="tab-panel"></div>
        <div id="panel-sidereal-vedic" class="tab-panel tab-panel--merged"></div>
        <div id="panel-chinese-bazi" class="tab-panel tab-panel--merged"></div>

        <div class="actions">
          <button type="button" id="download-json">Download JSON</button>
          <button type="button" id="download-pdf">Download PDF</button>
          <button type="button" id="download-chart">Download chart (SVG)</button>
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById("horoscoop-form");
      const results = document.getElementById("results");
      const diagnosticsEl = document.getElementById("diagnostics");
      const cityEl = document.getElementById("city");
      const latEl = document.getElementById("lat");
      const lonEl = document.getElementById("lon");
      const tzEl = document.getElementById("timezone_iana");

      let lastPayload = null;

      function setTabs() {
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            tabs.forEach((t) => t.classList.remove("active"));
            tab.classList.add("active");
            const target = tab.getAttribute("data-tab");
            document.querySelectorAll(".tab-panel").forEach((p) => {
              p.classList.remove("active");
            });
            document
              .getElementById("panel-" + target)
              .classList.add("active");
          });
        });
      }

      function collectForm() {
        const data = {};
        new FormData(form).forEach((v, k) => {
          if (v !== "") data[k] = v;
        });
        if (data.utc_offset_minutes) {
          data.utc_offset_minutes = parseInt(data.utc_offset_minutes, 10);
        }
        if (data.lat) data.lat = parseFloat(data.lat);
        if (data.lon) data.lon = parseFloat(data.lon);
        return data;
      }

      async function callApi(path) {
        const payload = collectForm();
        lastPayload = payload;
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          throw new Error("Request failed: " + res.status);
        }
        return res;
      }

      let resolveTimer = null;
      async function resolveCityIfNeeded() {
        const city = (cityEl.value || "").trim();
        if (!city) return;
        // Respect manual overrides: if user already entered all, don't touch.
        if (latEl.value && lonEl.value && tzEl.value) return;
        const res = await fetch("/api/resolve-place", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ city }),
        });
        if (!res.ok) return;
        const json = await res.json();
        if (!json || !json.ok) return;
        if (!latEl.value && typeof json.lat === "number") latEl.value = json.lat;
        if (!lonEl.value && typeof json.lon === "number") lonEl.value = json.lon;
        if (!tzEl.value && typeof json.timezone_iana === "string") {
          tzEl.value = json.timezone_iana;
        }
      }

      // Debounced resolve while typing, plus a final resolve on blur.
      cityEl.addEventListener("input", () => {
        if (resolveTimer) clearTimeout(resolveTimer);
        resolveTimer = setTimeout(() => resolveCityIfNeeded(), 450);
      });
      cityEl.addEventListener("blur", () => resolveCityIfNeeded());

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          // Ensure best chance at having lat/lon/tz before compute (if city provided).
          await resolveCityIfNeeded();
          const res = await callApi("/api/horoscoop");
          const json = await res.json();
          results.style.display = "block";
          renderResult(json);
        } catch (err) {
          alert(err);
        }
      });

      function renderResult(data) {
        diagnosticsEl.innerHTML = "";
        const codes = (data.diagnostics && data.diagnostics.codes) || [];
        const timeWarnings =
          (data.time && data.time.status && data.time.status.warnings) || [];
        if (codes.length || timeWarnings.length) {
          const frag = document.createDocumentFragment();
          codes.forEach((c) => {
            const span = document.createElement("span");
            span.className = "badge";
            span.textContent = c;
            frag.appendChild(span);
          });
          timeWarnings.forEach((w) => {
            const span = document.createElement("span");
            span.className = "badge";
            span.textContent = w;
            frag.appendChild(span);
          });
          diagnosticsEl.appendChild(frag);
        }

        const panelStoryEnergy = document.getElementById("panel-story-energy");
        panelStoryEnergy.innerHTML = "";
        panelStoryEnergy.appendChild(renderStory(data));

        const panelWestern = document.getElementById("panel-western");
        panelWestern.innerHTML = "";
        panelWestern.appendChild(renderWesternStory(data));

        const panelSiderealVedic = document.getElementById("panel-sidereal-vedic");
        panelSiderealVedic.innerHTML = "";
        panelSiderealVedic.appendChild(renderSiderealStory(data));
        panelSiderealVedic.appendChild(renderVedicStory(data));

        const panelChineseBazi = document.getElementById("panel-chinese-bazi");
        panelChineseBazi.innerHTML = "";
        panelChineseBazi.appendChild(renderChineseStory(data));
        panelChineseBazi.appendChild(renderBaziStory(data));
      }

      function p(text) {
        const el = document.createElement("p");
        el.style.margin = "0 0 10px 0";
        el.textContent = text;
        return el;
      }

      function renderStory(data) {
        const frag = document.createDocumentFragment();
        const birth = (data.input && data.input.birth) || {};
        const place = birth.place || {};
        const tz = birth.timezone || {};
        const when = [birth.date, birth.time_local ? String(birth.time_local).slice(0, 5) : null]
          .filter(Boolean)
          .join(" ");
        const where = (place.lat != null && place.lon != null) ? `${place.lat.toFixed(3)}, ${place.lon.toFixed(3)}` : null;
        const zone = tz.iana || (tz.utc_offset_hours != null ? `UTC${tz.utc_offset_hours >= 0 ? "+" : ""}${tz.utc_offset_hours}` : null);
        const openerBits = [when ? `On ${when}` : null, where ? `at ${where}` : null, zone ? `(${zone})` : null].filter(Boolean);
        frag.appendChild(p(openerBits.length ? `${openerBits.join(" ")} your chart was computed.` : "Your chart was computed from the data you provided."));
        frag.appendChild(p("This page shows the same birth moment through several traditions. Each method focuses on different layers of your horoscope, so reading them together gives a fuller picture of your life themes."));
        frag.appendChild(p("The Western tab describes psychological tone and life areas; Sidereal & Vedic the quality of the day (the \"weather\" of time); Chinese & BaZi your energetic pattern and timing. Story & energy gives the narrative overview."));
        return frag;
      }

      function renderWesternStory(data) {
        const frag = document.createDocumentFragment();
        const western = data.western || {};
        const placements = western.placements || {};
        const houses = western.houses || {};
        const angles = houses.angles || {};
        const asc = angles.asc_deg;
        const sun = placements.Sun || {};
        const moon = placements.Moon || {};
        if (!western || Object.keys(western).length === 0) {
          frag.appendChild(p("Western results aren’t available for this input (time, location, and timezone are usually required)."));
          return frag;
        }
        const sunLine = sun.sign
          ? `Your Sun stands in ${sun.sign}${sun.house ? `, in house ${sun.house}` : ""}. The Sun describes your core vitality, identity, and the life themes you grow into.`
          : "Your Sun placement wasn’t available.";
        const moonLine = moon.sign
          ? `Your Moon rests in ${moon.sign}${moon.house ? `, in house ${moon.house}` : ""}. The Moon describes your emotional needs, habits, and how you instinctively react.`
          : "Your Moon placement wasn’t available.";
        frag.appendChild(p(sunLine));
        frag.appendChild(p(moonLine));
        if (asc != null) {
          frag.appendChild(
            p(
              `The Ascendant rises at ${Math.round(
                asc
              )}° (tropical longitude). The Ascendant describes how you appear to others and how you approach new situations.`
            )
          );
        }
        const aspects = Array.isArray(western.aspects) ? western.aspects : [];
        if (aspects.length) {
          const a = aspects[0];
          if (a && a.a && a.b && a.type)
            frag.appendChild(
              p(
                `A notable thread: ${a.a} forms a ${a.type} with ${a.b}, describing how these two functions in your life cooperate or challenge each other.`
              )
            );
        }
        frag.appendChild(
          p(
            "In combination, the Western method gives a psychological map: planets describe drives, signs show style, houses point to life areas, and aspects show how different parts of you interact."
          )
        );
        return frag;
      }

      function renderSiderealStory(data) {
        const bodies = (data.astronomy && data.astronomy.bodies) || {};
        const keys = Object.keys(bodies || {});
        const frag = document.createDocumentFragment();
        if (!keys.length) {
          frag.appendChild(p("Sidereal-style body positions weren’t available (no computed bodies found)."));
          return frag;
        }
        frag.appendChild(
          p(
            `Astronomy computed ${keys.length} bodies. In the sidereal method, the same planets are anchored to the visible star constellations, so signs are measured against the fixed stars rather than the moving equinox.`
          )
        );
        frag.appendChild(
          p(
            "Compared with Western tropical, sidereal placements tend to shift signs for some planets; this can highlight how your inner experience (tropical) and outer, observable patterns (sidereal) may differ or reinforce each other."
          )
        );
        return frag;
      }

      function renderVedicStory(data) {
        const frag = document.createDocumentFragment();
        const vedic = data.vedic || {};
        const panchanga = vedic.panchanga || {};
        if (!panchanga || Object.keys(panchanga).length === 0) {
          frag.appendChild(p("Vedic Panchanga wasn’t available for this input."));
          return frag;
        }
        const vaara = panchanga.vaara;
        const tithi = (panchanga.tithi || {}).index;
        const nak = (panchanga.nakshatra || {}).index;
        const yoga = (panchanga.yoga || {}).index;
        const parts = [];
        if (vaara) parts.push(`Vaara: ${vaara}`);
        if (tithi != null) parts.push(`Tithi: ${tithi}`);
        if (nak != null) parts.push(`Nakshatra: ${nak}`);
        if (yoga != null) parts.push(`Yoga: ${yoga}`);
        frag.appendChild(
          p(
            parts.length
              ? `At that moment, the Panchanga reads like a weather report of time: ${parts.join(
                  ", "
                )}. Vaara is the weekday quality, Tithi is the lunar day and mood, Nakshatra is the lunar mansion (emotional field), and Yoga describes how Sun and Moon combine.`
              : "Panchanga values were present but incomplete."
          )
        );
        frag.appendChild(
          p(
            "Together, these Vedic factors describe the overall auspiciousness and tone of the day, so you can see how the moment of birth colors your life like a background climate."
          )
        );
        return frag;
      }

      function renderChineseStory(data) {
        const frag = document.createDocumentFragment();
        const chinese = data.chinese || {};
        if (!chinese || Object.keys(chinese).length === 0) {
          frag.appendChild(p("Chinese calendrical results weren’t available for this input."));
          return frag;
        }
        const terms = chinese.solar_terms;
        if (terms && typeof terms === "object") {
          const count = Object.keys(terms).length;
          frag.appendChild(
            p(
              `This year’s solar-term timeline was computed (${count} terms), anchoring the seasonal context. Solar terms divide the year into fine seasonal slices, showing when climate and collective energy shift.`
            )
          );
        } else {
          frag.appendChild(p("Seasonal anchors (solar terms) weren’t included in this run."));
        }
        frag.appendChild(
          p(
            "In combination with BaZi, the Chinese method explains how your personal pattern sits inside the larger seasonal and yearly cycles you live through."
          )
        );
        return frag;
      }

      function renderBaziStory(data) {
        const frag = document.createDocumentFragment();
        const bazi = ((data.chinese || {}).bazi_pillars) || {};
        if (!bazi || Object.keys(bazi).length === 0) {
          frag.appendChild(p("BaZi pillars weren’t available for this input (they depend strongly on time and timezone rules)."));
          return frag;
        }
        const y = bazi.year || {};
        const m = bazi.month || {};
        const d = bazi.day || {};
        const h = bazi.hour || {};
        const fmt = (p) => (p && p.stem && p.branch) ? `${p.stem}${p.branch}` : null;
        const bits = [
          fmt(y) ? `year ${fmt(y)}` : null,
          fmt(m) ? `month ${fmt(m)}` : null,
          fmt(d) ? `day ${fmt(d)}` : null,
          fmt(h) ? `hour ${fmt(h)}` : null,
        ].filter(Boolean);
        frag.appendChild(
          p(
            bits.length
              ? `Your BaZi story is told in four pillars: ${bits.join(
                  ", "
                )}. The year pillar describes background influences and ancestors, the month pillar your social and work environment, the day pillar your core self and close relationships, and the hour pillar your inner drives and long-term vision.`
              : "BaZi pillars were present but incomplete."
          )
        );
        frag.appendChild(
          p(
            "Read together, the four pillars show how different areas of life support or challenge each other over time, especially when combined with the seasonal picture in the Chinese overview above."
          )
        );
        return frag;
      }

      document
        .getElementById("download-json")
        .addEventListener("click", async () => {
          try {
            const res = await callApi("/api/horoscoop");
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "horoscoop.json";
            a.click();
            URL.revokeObjectURL(url);
          } catch (err) {
            alert(err);
          }
        });

      document
        .getElementById("download-pdf")
        .addEventListener("click", async () => {
          try {
            const res = await callApi("/api/horoscoop/report.pdf");
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "horoscoop-report.pdf";
            a.click();
            URL.revokeObjectURL(url);
          } catch (err) {
            alert(err);
          }
        });

      document
        .getElementById("download-chart")
        .addEventListener("click", async () => {
          try {
            const res = await callApi("/api/horoscoop/chart.svg");
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "horoscoop-chart.svg";
            a.click();
            URL.revokeObjectURL(url);
          } catch (err) {
            alert(err);
          }
        });

      setTabs();
    </script>
  </body>
</html>
