[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horoscoop"
version = "1.0.0"
description = "Reproducible astrology computation engine with FastAPI UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10.0",
    "pytest>=7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "cairosvg>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
